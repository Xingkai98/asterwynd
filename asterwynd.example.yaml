agent:
  default_mode: build

modes:
  build:
    permission_profile: build_default
    deny_tools: []
  read_only:
    permission_profile: read_only_default
    deny_tools: []
  plan:
    permission_profile: plan_default
    deny_tools: []
  bypass:
    permission_profile: bypass_default
    deny_tools: []

permissions:
  profiles:
    # 示例：自定义 profile 只能绑定到既有 mode，不会新增 Agent Mode。
    # cautious_build:
    #   allowed_capabilities:
    #     - workspace_read
    #     - workspace_write
    #     - command_execute
    #     - network_read
    #     - agent_state
    #     - subagent_control
    #   auto_approve_max_risk: low
    #   approval_required_max_risk: high
    #   denied_tools: []

tools:
  ignore_patterns: []
  command_denylist: []
  # 显式可写豁免：「deny 默认 + 精确覆盖」——只把**已列出的精确路径**重新
  # 放行为可写，未列入的照旧拒绝。用法见 agent/workspace_policy.py 的判定谓词。
  # 约束（非法条目会在加载配置时直接报错）：
  #   - 只接受 workspace 相对路径的**字面值**，不接受 glob（`**/*` 会把
  #     .git/config 一起打开）；
  #   - 不支持目录前缀（不写 `config/`，要逐文件列）；
  #   - 只影响写，不影响读；只覆盖文件级 deny，不覆盖 .git/** 等结构性目录 deny；
  #   - 已知边界：嵌套路径（如 config/.env）的 Bash `cp` / `mv` 写不被覆盖
  #     （命令护栏的整句 denylist 扫描在其之前生效），其余写形态可用。
  allowed_write_paths: []
  # 示例（按需打开）：让 agent 能生成项目自己的 env 文件
  # allowed_write_paths:
  #   - .env
  code_intelligence:
    tree_sitter_max_file_bytes: 262144
    lsp:
      # 当前只正式支持 Python（pylsp）。其他语言可配置对应 server，但尚未验证。
      # 安装: uv sync --extra lsp 或 pip install asterwynd[lsp]
      servers:
        - language: python
          command: [pylsp]
          root_markers: [pyproject.toml]
          initialize_timeout_ms: 5000
          request_timeout_ms: 3000
          enabled: true
      default_request_timeout_ms: 3000
  web_search:
    providers:
      # Tavily 需要 ASTERWYND_TAVILY_API_KEY。
      # - name: tavily
      #   enabled: true
      - name: duckduckgo-html
        enabled: true
      # Brave 需要 ASTERWYND_BRAVE_SEARCH_API_KEY。
      # - name: brave
      #   enabled: true
      # SearXNG 需要 ASTERWYND_SEARXNG_BASE_URL。
      # - name: searxng
      #   enabled: true
  display:
    max_result_chars: 4000
    max_result_lines: 80
    preview_chars: 1200
  # Read 工具默认输出上界：无显式正 limit 时按行/字节先到者截断。
  read:
    max_lines: 2000
    max_bytes: 131072

mcp:
  default_timeout_seconds: 30
  servers:
    # 示例：本地 stdio MCP server。未显式降权的 MCP action 默认 external_side_effect/high。
    # local_math:
    #   type: stdio
    #   command: python
    #   args: ["./scripts/mcp_math_server.py"]
    #   cwd: "."
    #   env: {}
    #   default_permission:
    #     capabilities: ["network_read"]
    #     risk_level: low
    #
    # 示例：Streamable HTTP MCP server。OAuth 不在首版范围内，可用静态 header 或 env header。
    # docs:
    #   type: streamable_http
    #   url: "http://127.0.0.1:8765/mcp"
    #   headers:
    #     Authorization:
    #       env: DOCS_MCP_TOKEN
    #   tool_timeout_seconds: 30
    #   prompts:
    #     review_pr:
    #       capabilities: ["network_read"]
    #       risk_level: low

skills:
  # 仓库本地 ./skills 总是最先加载；roots 用于追加其他本地 skill 目录。
  roots: []

benchmark:
  parallel: 1
  timeout_seconds: 600

team:
  # 群聊讨论链（房间 discussion_mode = unlimited）的安全阀，缺省取 10 倍档：
  # 200 轮 / 600 成员回合 / 6000 秒。任一到达即停止整条讨论链并写 system 条目。
  # 单轮模式（single）不使用这三个参数。配置在 Web 进程启动期解析一次，
  # 改动需重启进程；链启动时快照，运行中改配置不影响已启动的链。
  # 校验：正整数 / 正数；0、负数、字符串或 YAML 布尔值都会 fail fast（ConfigError）。
  discussion_max_rounds: 200
  discussion_max_turns: 600
  discussion_max_seconds: 6000

web:
  # Web UI（asterwynd web）允许操作的额外工作区路径（必须是绝对路径，~ 可展开）。
  # 主 workspace（启动目录或 --workspace）始终有效，不在这里重复列；列出的路径
  # 会出现在 hub 的 workspace 选择器里。路径不存在时启动阶段排除并打 warning。
  workspaces: []
  # 说明：hub 的「Workspace → + 添加」写入 <本配置文件目录>/.asterwynd/workspaces.yaml，
  # 启动时与上面的 workspaces 合并生效；该文件由程序独占写入，不会改写本文件。
