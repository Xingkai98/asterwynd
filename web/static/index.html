<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asterwynd · Asterwynd Web UI</title>
<link rel="stylesheet" href="/static/style.css?v=18">
</head>
<body>
<div id="app">
  <header>
    <div class="brand-lockup" aria-label="Asterwynd">
      <img src="/assets/asterwynd-web-wordmark.png?v=3" alt="Asterwynd" class="brand-wordmark">
      <span class="brand-fallback">Asterwynd</span>
    </div>
    <nav id="tabs">
      <button class="tab active" data-tab="hub" id="hub-tab">Sessions</button>
      <button class="tab" data-tab="chat" id="chat-tab">Chat</button>
      <button class="tab" data-tab="debug" id="debug-tab" style="display:none">Debug</button>
    </nav>
    <div id="session-tabs" class="session-tabs" hidden></div>
    <div id="identity-bar" aria-label="runtime identifiers">
      <span>Session <code id="session-id">pending</code></span>
      <span>Run <code id="run-id">none</code></span>
      <span>Mode <code id="mode-value">build</code></span>
      <div id="mode-controls">
        <select id="mode-select" aria-label="Mode">
          <option value="build">build</option>
          <option value="read_only">read_only</option>
          <option value="plan">plan</option>
          <option value="bypass">bypass</option>
        </select>
        <button id="mode-apply" type="button">Apply</button>
      </div>
    </div>
    <span id="status"></span>
  </header>

  <main>
    <!-- Hub View -->
    <section id="hub-view" class="view active">
      <div class="hub-layout">
        <div class="hub-sidebar">
          <div class="hub-section">
            <div class="hub-section-header"><span>Workspace</span></div>
            <select id="hub-workspace-select" aria-label="Workspace"></select>
          </div>
          <div class="hub-section">
            <div class="hub-section-header"><span>新建会话</span></div>
            <div class="hub-new-form">
              <select id="hub-new-mode" aria-label="Mode">
                <option value="build">build</option>
                <option value="read_only">read_only</option>
                <option value="plan">plan</option>
                <option value="bypass">bypass</option>
              </select>
              <select id="hub-new-workspace" aria-label="Workspace"></select>
              <button id="hub-new-btn" type="button">新建</button>
            </div>
          </div>
        </div>
        <div class="hub-list">
          <div class="hub-section-header">
            <span>已保存会话</span>
            <span id="hub-list-count" class="hub-list-count"></span>
          </div>
          <div id="hub-session-list" class="hub-session-list">
            <div class="hub-empty">加载中…</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Chat View -->
    <section id="chat-view" class="view">
      <div id="plan-document-panel" class="plan-document-panel" hidden>
        <div class="plan-document-header">
          <button id="plan-document-toggle" class="planning-toggle" type="button" aria-expanded="true" aria-controls="plan-document-body" aria-label="Collapse panel" title="Collapse">&#x25BC;</button>
          <span class="plan-document-header-title">Plan Document</span>
        </div>
        <div id="plan-document-title" class="plan-document-title"></div>
        <div id="plan-document-body" class="markdown-body"></div>
      </div>
      <div id="planning-panel" class="planning-panel" hidden>
        <div class="planning-panel-header">
          <button id="planning-toggle" class="planning-toggle" type="button" aria-expanded="true" aria-controls="planning-items" aria-label="Collapse panel" title="Collapse">&#x25BC;</button>
          <span id="planning-title" class="planning-title">Plan</span>
          <span id="planning-count" class="planning-count" hidden></span>
        </div>
        <ol id="planning-items" class="planning-items"></ol>
      </div>
      <div id="chat-panes"></div>
    </section>

    <!-- Debug View -->
    <section id="debug-view" class="view">
      <div id="timeline-panel" class="timeline-panel">
        <div class="timeline-panel-header">
          <span>Tool Call Timeline</span>
          <button id="timeline-refresh" type="button">刷新</button>
        </div>
        <div id="timeline-content"><div class="timeline-empty">暂无工具调用</div></div>
      </div>
      <div id="debug-content"></div>
    </section>
  </main>
</div>

<script src="/static/markdown.js?v=6"></script>
<script src="/static/chat.js?v=20"></script>
<script src="/static/debug.js?v=6"></script>
</body>
</html>
