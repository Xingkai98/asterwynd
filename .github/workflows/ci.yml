name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so protected-path checks can diff against the PR base
          # (shallow checkouts silently skip the gate).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # workflow 流程图的跨端布局 / pinch+pan 只能在真浏览器里验收（grill Q7）。
      # 装 chromium 后 tests/web_tests/test_workflow_graph_browser.py 会真跑（此前与
      # test_browser.py 一样因为没有浏览器而恒 skip）。node 单测那条路径不依赖它。
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest -q

      # change fix-windows-encoding-and-guard：Linux 的 locale 就是 UTF-8，于是
      # 「本地文件 I/O 没写 encoding=」在这里与显式 UTF-8 **行为一致**——这类缺陷在
      # 默认环境下不可能变红（实测 Windows/GBK 上会让会话保存失败、Hub 列表 500）。
      # 用一个 C locale 步骤把「非 UTF-8 locale」搬进 CI：比加 Windows runner 便宜得多，
      # 且能覆盖绝大部分编码类缺陷（路径语义类由 windows-platform job 覆盖）。
      - name: Run tests (non-UTF-8 locale)
        env:
          LC_ALL: C
          LANG: C
          PYTHONCOERCECLOCALE: "0"
          PYTHONUTF8: "0"
        run: |
          uv run pytest -q \
            tests/agent/test_session_encoding.py \
            tests/web_tests/test_encoding_hygiene.py \
            tests/agent/test_session.py \
            tests/agent/memory/test_persistent.py \
            tests/web_tests/test_server.py

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.4.1 validate --all --strict

      - name: Check OpenSpec artifacts
        run: |
          # Diff the PR branch against its base (or HEAD on a push) so
          # protected-path changes cannot silently pass the event gate.
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="$GITHUB_SHA"
          fi
          uv run python scripts/check_openspec_artifacts.py --base-ref "$BASE_REF" --require-base

      - name: Check archived change manifests
        run: |
          # #232 B 盲区：归档 change 也要脱离校验——归档后 tasks.md 仍会被勾选，
          # 故归档语境的 tasks_hash 降级（可见汇总见 stderr），其余 hash/字段仍校验。
          # --skip-protected-paths / --skip-backlog：第一步已带 base-ref 覆盖，这里
          # 避免默认 --base-ref master 在 CI 上解析失败打出无意义 WARNING 与重复检查。
          uv run python scripts/check_openspec_artifacts.py \
            --check-archived --skip-protected-paths --skip-backlog

  benchmark-gate:
    name: benchmark-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          # gate-smoke tasks use `git worktree add <base_commit>`; the base
          # commit must exist locally, so a shallow (fetch-depth:1) checkout
          # would make every task fail. Full history is required.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Configure git identity
        run: |
          git config user.name "CI"
          git config user.email "ci@example.com"

      - name: Run benchmark regression gate
        run: uv run asterwynd benchmark-gate benchmarks/tasks/gate-smoke --source-repo . --runs-dir /tmp/benchmark-gate-runs --baseline benchmarks/baseline.json --require-baseline --skip-p95

  # change fix-windows-encoding-and-guard（L3）：上面两个 job 都是 ubuntu-latest，locale
  # 天然是 UTF-8，因此**平台相关**的缺陷（非 UTF-8 locale 的编解码、Windows 路径语义）
  # 在 CI 上结构性地看不见。这个 job 把 Windows 纳入信号面，只跑「平台敏感 + 本次改动
  # 直接覆盖」的子集以控制成本（Windows runner 计费约为 Linux 的 2 倍）：
  #   - 编码类：test_session_encoding / test_encoding_hygiene（含 C-locale 子进程用例）
  #   - 会话与列表：test_session / test_server（Hub 接口）
  #   - 路径语义：test_multi_session（敏感根、~ 展开、大小写变体）
  #   - 前端工具行：test_transcript_*（Windows 上的 GBK 解码曾是主要假红来源）
  windows-platform:
    name: windows-platform
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # 与 ubuntu job 同理：不装 chromium，transcript/浏览器用例会静默 skip，等于白跑。
      # Windows runner 不需要 --with-deps（那是 Linux 的 apt 依赖安装）。
      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run platform-sensitive tests
        run: |
          uv run pytest -q `
            tests/agent/test_session_encoding.py `
            tests/agent/test_session.py `
            tests/web_tests/test_encoding_hygiene.py `
            tests/web_tests/test_server.py `
            tests/web_tests/test_multi_session.py `
            tests/web_tests/test_transcript_js.py `
            tests/web_tests/test_transcript_view_browser.py
